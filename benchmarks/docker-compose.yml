services:
  smite:
    build:
      context: ..
      dockerfile: benchmarks/servers/smite/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  express:
    build:
      context: ./servers/express
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  fastify:
    build:
      context: ./servers/fastify
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
